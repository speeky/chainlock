[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainlock-cli"
version = "0.3.0"
description = "Supply-chain security scanner for your dependencies. Zero-dependency, OSV-powered."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["security", "supply-chain", "dependencies", "osv", "sbom", "typosquat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
chainlock = "chainlock.cli:main"

[project.urls]
Homepage = "https://chainlock.dev"
Repository = "https://github.com/speeky/chainlock"

[tool.setuptools.packages.find]
where = ["src"]
